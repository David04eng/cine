<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineManager - David</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #22d3ee;
            --occupied-red: #ef4444;
            --text-gray: #94a3b8;
        }

        body { 
            background-color: var(--bg-color); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(to right, #22d3ee, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .screen-curve {
            width: 70%;
            height: 40px;
            margin: 0 auto 40px;
            border-top: 5px solid #334155;
            border-radius: 50% / 20px 20px 0 0;
            text-align: center;
            padding-top: 10px;
            color: var(--text-gray);
            letter-spacing: 5px;
            box-shadow: 0 -15px 20px -10px rgba(34, 211, 238, 0.2);
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .seat {
            width: 45px;
            height: 45px;
            border: 2px solid #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-gray);
        }

        .seat:hover:not(.occupied) {
            border-color: var(--accent-cyan);
            color: white;
        }

        .seat.selected {
            background-color: var(--accent-cyan) !important;
            border-color: var(--accent-cyan);
            color: var(--bg-color) !important;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .seat.occupied {
            background-color: var(--occupied-red) !important;
            border-color: var(--occupied-red);
            color: white;
            cursor: not-allowed;
        }

        .card-panel {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }

        /* Estilo mejorado para los pósters */
        .movie-card img {
            width: 100%;
            height: 140px;
            object-fit: cover; 
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .btn-check:checked + .btn-outline-info {
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            border-color: var(--accent-cyan);
        }

        .table { color: white; border-color: #334155; }
        .table thead th { color: var(--accent-cyan); }
        
        .btn-reserve {
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="brand-title">CineManager</h1>
            <p class="text-muted">Selecciona de 1 a 4 asientos por cliente</p>
        </div>

        <div class="row">
            <!-- IZQUIERDA: SALA Y FORMULARIO -->
            <div class="col-lg-6">
                <div class="screen-curve">PANTALLA</div>
                <div class="d-flex justify-content-center mb-4">
                    <div class="seat-grid" id="contenedorAsientos"></div>
                </div>

                <form th:action="@{/resumen}" method="post" class="card-panel">
                    <div class="mb-3">
                        <label class="form-label">Identificación (DNI)</label>
                        <input type="text" name="dni" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre del Cliente</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Selecciona la Película</label>
                        <div class="row g-2">
                            <!-- Iron Claw -->
                            <div class="col-3 movie-card text-center">
                                <input type="radio" name="pelicula" value="The Iron Claw" id="p1" class="btn-check" required>
                                <label class="btn btn-outline-info p-1 w-100" for="p1">
                                    <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Iron_claw_film_posterjpg.jpg" alt="Iron Claw">
                                    <div style="font-size: 10px; margin-top: 5px;">Iron Claw</div>
                                </label>
                            </div>
                            <!-- Jaws -->
                            <div class="col-3 movie-card text-center">
                                <input type="radio" name="pelicula" value="Jaws" id="p2" class="btn-check">
                                <label class="btn btn-outline-info p-1 w-100" for="p2">
                                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM80rW1WI9XwnKfJuLCf8YlLwbQSvavcGPTbNNFY0MfZWPrOg8LMTce7Ml6zAPxIqbPTff&s=10" alt="Jaws">
                                    <div style="font-size: 10px; margin-top: 5px;">Jaws</div>
                                </label>
                            </div>
                            <!-- Centipede -->
                            <div class="col-3 movie-card text-center">
                                <input type="radio" name="pelicula" value="The Human Centipede" id="p3" class="btn-check">
                                <label class="btn btn-outline-info p-1 w-100" for="p3">
                                    <img src="https://m.media-amazon.com/images/M/MV5BMTY4Nzk3NzYxOF5BMl5BanBnXkFtZTcwODQwNjQzMw@@._V1_.jpg" alt="Centipede">
                                    <div style="font-size: 10px; margin-top: 5px;">Centipede</div>
                                </label>
                            </div>
                            <!-- Scream -->
                            <div class="col-3 movie-card text-center">
                                <input type="radio" name="pelicula" value="Scream" id="p4" class="btn-check">
                                <label class="btn btn-outline-info p-1 w-100" for="p4">
                                    <img src="https://m.media-amazon.com/images/I/41003ngClfL._AC_UF894,1000_QL80_.jpg" alt="Scream">
                                    <div style="font-size: 10px; margin-top: 5px;">Scream</div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Combos / Dulces</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="dulcesSeleccionados" value="Palomitas">
                            <label class="form-check-label">Palomitas ($60)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="dulcesSeleccionados" value="Refresco">
                            <label class="form-check-label">Refresco ($30)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="dulcesSeleccionados" value="Nachos">
                            <label class="form-check-label">Nachos ($50)</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Asientos</label>
                            <div id="asientosInputsHidden"></div>
                            <input type="text" id="displayAsientos" class="form-control" readonly placeholder="Mín 1, Máx 4" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select">
                                <option value="General">General ($80)</option>
                                <option value="VIP">VIP ($150)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btnReservar" class="btn btn-reserve w-100 py-2" disabled>CONTINUAR COMPRA</button>
                </form>
            </div>

            <!-- DERECHA: TABLA DE VENTAS -->
            <div class="col-lg-6">
                <h3 class="mb-4">Lista de Ventas</h3>
                <div class="card-panel">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Info</th>
                                    <th>Ticket</th>
                                    <th>Eliminar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${asistentes}">
                                    <td>
                                        <div th:text="${a.nombre}" class="fw-bold"></div>
                                        <small class="text-muted" th:text="${a.dni}"></small>
                                    </td>
                                    <td>
                                        <small class="text-info" th:text="${a.pelicula}"></small><br>
                                        <small th:text="${a.asiento}"></small>
                                    </td>
                                    <td>
                                        <a th:href="${a.qrUrl}" target="_blank" class="btn btn-sm btn-info">Ver QR</a>
                                    </td>
                                    <td>
                                        <a th:href="@{'/eliminar/' + ${a.id}}" class="text-danger fw-bold" onclick="return confirm('¿Eliminar esta venta?')">X</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(asistentes)}">
                                    <td colspan="4" class="text-center text-muted">No hay ventas registradas</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const contenedor = document.getElementById('contenedorAsientos');
        const displayAsientos = document.getElementById('displayAsientos');
        const asientosHidden = document.getElementById('asientosInputsHidden');
        const btnReservar = document.getElementById('btnReservar');
        
        const filas = ['A', 'B', 'C', 'D', 'E'];
        const columnas = 5;
        let seleccionados = [];

        // Obtener asientos ocupados de la lista de asistentes
        const asistentes = /*[[${asistentes}]]*/ [];
        const ocupados = [];
        asistentes.forEach(a => {
            if (a.asiento) a.asiento.split(', ').forEach(s => ocupados.push(s.trim()));
        });

        // Generar la cuadrícula de asientos
        filas.forEach(f => {
            for(let c = 1; c <= columnas; c++) {
                const id = f + c;
                const div = document.createElement('div');
                div.className = 'seat';
                div.innerText = id;

                if(ocupados.includes(id)) {
                    div.classList.add('occupied');
                } else {
                    div.onclick = () => {
                        if (div.classList.contains('selected')) {
                            div.classList.remove('selected');
                            seleccionados = seleccionados.filter(s => s !== id);
                        } else {
                            if (seleccionados.length < 4) {
                                div.classList.add('selected');
                                seleccionados.push(id);
                            } else {
                                alert("Máximo 4 asientos por compra.");
                            }
                        }
                        actualizar();
                    };
                }
                contenedor.appendChild(div);
            }
        });

        function actualizar() {
            displayAsientos.value = seleccionados.join(', ');
            asientosHidden.innerHTML = '';
            seleccionados.forEach(id => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'asientosSeleccionados';
                input.value = id;
                asientosHidden.appendChild(input);
            });
            btnReservar.disabled = seleccionados.length === 0;
            btnReservar.innerText = seleccionados.length > 0 ? `CONTINUAR CON ${seleccionados.length} ASIENTO(S)` : "SELECCIONA ASIENTOS";
        }
    </script>
</body>
</html>
