<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumen de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; padding-top: 50px; }
        .card-resumen { background-color: #1e293b; border-radius: 15px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .detail-label { color: #22d3ee; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card-resumen">
                <h2 class="text-center mb-4 border-bottom pb-2">Resumen de Compra</h2>
                
                <div class="mb-3">
                    <p><span class="detail-label">Cliente:</span> <span th:text="${asistente.nombre}"></span></p>
                    <p><span class="detail-label">DNI:</span> <span th:text="${asistente.dni}"></span></p>
                    <p><span class="detail-label">Película:</span> <span th:text="${asistente.pelicula}"></span></p>
                    <p><span class="detail-label">Asientos:</span> <span th:text="${asistente.asiento}"></span></p>
                    <p><span class="detail-label">Dulces:</span> <span th:text="${asistente.dulces}"></span></p>
                    <p><span class="detail-label">Tipo:</span> <span th:text="${asistente.tipo}"></span></p>
                    <h3 class="text-center mt-4 text-info">Total: $<span th:text="${asistente.precio}"></span></h3>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <!-- BOTÓN EDITAR: Regresa al formulario usando JavaScript para no perder los datos -->
                    <button onclick="window.history.back();" class="btn btn-outline-warning w-50">EDITAR</button>

                    <!-- BOTÓN CONFIRMAR: Envía los datos finales al método /comprar del controlador -->
                    <form th:action="@{/comprar}" method="post" class="w-50">
                        <input type="hidden" name="dni" th:value="${asistente.dni}">
                        <input type="hidden" name="nombre" th:value="${asistente.nombre}">
                        <input type="hidden" name="asiento" th:value="${asistente.asiento}">
                        <input type="hidden" name="pelicula" th:value="${asistente.pelicula}">
                        <input type="hidden" name="dulces" th:value="${asistente.dulces}">
                        <input type="hidden" name="tipo" th:value="${asistente.tipo}">
                        <input type="hidden" name="precio" th:value="${asistente.precio}">
                        <button type="submit" class="btn btn-info w-100 fw-bold">CONFIRMAR COMPRA</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
